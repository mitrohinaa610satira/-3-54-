<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mix Station — плейлисты в стиле Spotify</title>

    <!--
        Bootstrap подключён через CDN (jsDelivr), версия зафиксирована — 5.3.3.
        Если нужно подключить ровно так, как показано в методичке (через npm),
        выполните в терминале: npm install
        и замените два тега ниже на:
        <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
        ...
        <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
        Работать это будет одинаково в обоих случаях.
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="custom.css">
</head>
<body>

<div id="root"></div>

<script src="main.js" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
