<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Calc — Митрохина Анастасия</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Стили только для стартовой страницы (лендинга) */
    .landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      gap: 22px;
    }

    .landing-logo {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      box-shadow: 0 10px 40px rgba(29, 185, 84, 0.45);
    }

    .landing-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .landing-subtitle {
      max-width: 380px;
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.5;
      margin: 0;
    }

    .landing-cta {
      display: inline-block;
      text-decoration: none;
      background: var(--accent);
      color: #0d0d0d;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 16px 44px;
      border-radius: 32px;
      transition: transform 0.15s ease, background-color 0.15s ease;
      box-shadow: 0 12px 30px rgba(29, 185, 84, 0.35);
    }

    .landing-cta:hover {
      background: var(--accent-hover);
      transform: scale(1.04);
    }

    .landing-footer {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="controls" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%);">
    <select id="accent-select" class="theme-select" title="Выбрать акцентный цвет">
      <option value="theme-green" selected>🟢 Зелёная (Spotify)</option>
      <option value="theme-blue">🔵 Синяя</option>
      <option value="theme-purple">🟣 Фиолетовая</option>
    </select>
    <button id="theme-toggle" class="theme-toggle-btn" title="Сменить тему (тёмная/светлая)">🌙</button>
  </div>

  <div class="landing">
    <div class="landing-logo">🎧</div>
    <h1 class="landing-title">Spotify&nbsp;Calc</h1>
    <p class="landing-subtitle">
      Калькулятор в стилистике Spotify — тёмная тема, зелёный акцент
      и рабочая логика на JavaScript. Нажмите «Play», чтобы начать считать.
    </p>

    <a class="landing-cta" href="calculator.html">▶ Открыть калькулятор</a>

    <p class="landing-footer">ЛР2 выполнила Митрохина Анастасия Александровна, гр. ИБМ3-54Б</p>
  </div>

  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    themeToggleBtn.onclick = function () {
      document.body.classList.toggle('light');
      themeToggleBtn.textContent = document.body.classList.contains('light') ? '☀️' : '🌙';
    };

    const accentSelect = document.getElementById('accent-select');
    accentSelect.onchange = function (e) {
      document.body.classList.remove('theme-green', 'theme-blue', 'theme-purple');
      document.body.classList.add(e.target.value);
    };
    document.body.classList.add('theme-green');
  </script>

</body>

</html>
